name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# Each check is a job of its own, so they run side by side and each passes or fails under its own name.
# The workspace's setup is shared: .github/actions/setup.
jobs:
  game-data:
    name: Game data
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      # Every commit the push or pull request brings, so a file added and deleted again is still checked.
      - name: Check every new commit for game data
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -n "$base" ] && git cat-file -e "$base" 2>/dev/null && [ "$base" != 0000000000000000000000000000000000000000 ]; then
            node scripts/check-game-data.ts --range "$base..HEAD"
          else
            node scripts/check-game-data.ts --range HEAD
          fi

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm run typecheck

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm run test

  workshop:
    name: Component workshop build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm --filter @rac-editions/ui run workshop:build

  builder:
    name: Builder build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm --filter @rac-editions/builder run build

  # The wizard end to end against the fake installer, in Playwright's Chromium.
  e2e:
    name: Builder end-to-end
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm --filter @rac-editions/builder exec playwright install --with-deps chromium
      - run: pnpm --filter @rac-editions/builder run e2e

  # The builder's desktop shell (Rust): built and linted on Linux, whose WebKitGTK it needs.
  desktop:
    name: Desktop shell (Rust)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: apps/builder/src-tauri
      - run: cargo fmt --manifest-path apps/builder/src-tauri/Cargo.toml --check
      - run: cargo clippy --manifest-path apps/builder/src-tauri/Cargo.toml --locked -- -D warnings
