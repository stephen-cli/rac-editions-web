[package]
name = "editions-builder"
version = "0.2.0"
description = "The Editions Builder: makes an edition from the player's own disc images"
edition = "2024"
license = "MIT"
publish = false

[lib]
name = "editions_builder_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"
tauri-plugin-opener = "2.7"
serde_json = "1"
